---
# yaml-language-server: $schema=https://raw.githubusercontent.com/OAI/Overlay-Specification/refs/heads/main/schemas/v1.0/schema.yaml
overlay: 1.0.0
info:
  title: Overlay
  version: 0.0.0
actions:
  - target: $.components.schemas.Config.properties
    update:
      server:
        x-go-type: ccfg.ServerConfig
        x-go-type-import:
          path: github.com/rkosegi/go-http-commons/config
          name: ccfg
      backends:
        x-go-type: map[string]*BackendConfig
      client_profiles:
        x-go-type: map[string]ClientProfile
  - target: $.components.schemas.BackendConfig.properties
    update:
      db:
        x-go-type: sql.DB
        x-go-name: db
        x-go-json-ignore: true
      conn_max_lifetime:
        x-go-type: time.Duration
      conn_max_idle_time:
        x-go-type: time.Duration
      entities:
        x-go-type: map[string]*EntityConfig
